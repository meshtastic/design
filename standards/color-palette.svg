  <rect x="620" y="724" width="520" height="0" fill="#2C2D3C"/>
  <text x="644" y="722" font-size="13" font-weight="700" fill="#F5F6FA">Dark Mode</text>

  <!-- Dark mode content -->
  <circle cx="656" cy="764" r="18" fill="#67EA94"/>
  <text x="650" y="769" font-size="14" font-weight="600" fill="#2C2D3C" text-anchor="middle">M</text>
  <text x="686" y="760" font-size="13" font-weight="600" fill="#ECEDF3">Base Node</text>
  <text x="686" y="776" font-size="11" fill="#9496A6">Last heard 2 min ago</text>

  <circle cx="656" cy="812" r="18" fill="#5C6BC0"/>
  <text x="650" y="817" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">R</text>
  <text x="686" y="808" font-size="13" font-weight="600" fill="#ECEDF3">Relay Node</text>
  <text x="686" y="824" font-size="11" fill="#9496A6">3 hops · SNR 10.5</text>

  <rect x="686" y="844" width="80" height="28" rx="6" fill="#67EA94"/>
  <text x="726" y="863" font-size="11" font-weight="600" fill="#2C2D3C" text-anchor="middle">Connect</text>

  <rect x="776" y="844" width="80" height="28" rx="6" fill="none" stroke="#3D3E50" stroke-width="1"/>
  <text x="816" y="863" font-size="11" font-weight="600" fill="#9496A6" text-anchor="middle">Details</text>

  <!-- Footer -->
  <text x="600" y="910" font-size="10" fill="#9496A6" text-anchor="middle">★ = Brand color · All pairings meet WCAG AA 4.5:1 contrast · Meshtastic® Design Standards</text>
</svg>