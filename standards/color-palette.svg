  <text x="126" y="808" font-size="13" font-weight="600" fill="#2C2D3C">Relay Node</text>
  <text x="126" y="824" font-size="11" fill="#6E7082">3 hops · SNR 10.5</text>

  <rect x="126" y="844" width="80" height="28" rx="6" fill="#67EA94"/>
  <text x="166" y="863" font-size="11" font-weight="600" fill="#2C2D3C" text-anchor="middle">Connect</text>

  <rect x="216" y="844" width="80" height="28" rx="6" fill="none" stroke="#D5D6E0" stroke-width="1"/>
  <text x="256" y="863" font-size="11" font-weight="600" fill="#6E7082" text-anchor="middle">Details</text>

